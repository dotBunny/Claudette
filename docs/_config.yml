# Claudette's user guide (GUIDE.md). GitHub Pages builds it from docs/ on main and publishes it at the domain in CNAME.
# So only GitHub Pages' own plugins (https://pages.github.com/versions/) and no build scripts of ours.
title: Claudette
description: How to use Claudette, the desktop app that puts Claude Code in a native window.
url: https://claudette.dotbunny.com
lang: en

# A page's address is a folder, /tabs/opening-tabs/ rather than /tabs/opening-tabs.html (GUIDE.md, "The site").
permalink: pretty

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata
  - jekyll-redirect-from

# A page's redirect_from leaves a page at its old address; nothing reads the list of them it would publish too.
redirect_from:
  json: false

# The repository, for site.github: the Downloads page lists its releases.
repository: dotBunny/Claudette

logo: /assets/claudette.svg
favicon_ico: /assets/favicon.ico
color_scheme: claudette-light

# The picture a link to any page shows where it's shared, which jekyll-seo-tag writes as og:image and twitter:image: the
# social card, drawn by tools/Claudette.Demo/social-card.ps1 (GUIDE.md, "The site").
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/social-card.png
        width: 1280
        height: 640
        alt: "Claudette: Claude Code in a real desktop window. Every session in a tab, every change in sight."

search_enabled: true
search:
  heading_level: 3
  previews: 2
  button: true

heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

# The header of every guide page: back to the landing page, the downloads, dotBunny's Discord, and the repository.
aux_links:
  Home: /
  Downloads: /downloads/
  Discord: /discord/
  GitHub: https://github.com/dotBunny/Claudette

# The changelog is CHANGELOG.md itself, last in the sidebar (GUIDE.md, "The changelog").
nav_external_links:
  - title: Changelog
    url: https://github.com/dotBunny/Claudette/blob/main/CHANGELOG.md
    hide_icon: false

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/dotBunny/Claudette
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

# Claude Code's versions, which pages name: compat/surface.yaml's minimum and lastTested (ClaudeLocator). Change them
# together.
claude_code:
  minimum: 2.1.284
  tested: 2.1.312

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
